name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # tomllib is stdlib only in Python 3.11+; tomli is the backport
          # for the version consistency check below.
          python -c "import sys; sys.exit(0 if sys.version_info >= (3, 11) else 1)" || pip install tomli

      - name: Run tests
        run: pytest -q --cov=roe_guard --cov-report=term-missing

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Version consistency check
        run: |
          pyproject_version=$(python -c "import sys
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          pkg_version=$(python -c "from roe_guard import __version__; print(__version__)")
          if [ "$pyproject_version" != "$pkg_version" ]; then
            echo "Version mismatch: pyproject.toml=$pyproject_version, roe_guard/__init__.py=$pkg_version"
            exit 1
          fi
          echo "Versions consistent: $pyproject_version"

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Install runtime + dev dependencies
        # Install dependencies WITHOUT roe-guard itself — pip-audit can
        # only audit third-party packages on PyPI, and our self-reference
        # is not yet on PyPI (T9 ticket is the packaging step).
        run: |
          pip install pyyaml
          pip install pytest pytest-cov ruff tomli mypy==2.4.0 types-PyYAML==6.0.12.20260906 jsonschema==4.26.0 cryptography==50.0.2

      - name: Run pip-audit
        # Audit only the third-party deps from requirements-style list,
        # not the roe-guard package itself.
        run: |
          cat > /tmp/requirements.txt <<'EOF'
          pyyaml
          pytest
          pytest-cov
          ruff
          tomli
          mypy==2.4.0
          types-PyYAML==6.0.12.20260906
          jsonschema==4.26.0
          cryptography==50.0.2
          EOF
          pip-audit --strict -r /tmp/requirements.txt
