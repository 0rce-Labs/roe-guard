schema_version: 2
engagement_id: "fx-valid_sandbox"
valid_from: "2026-10-01T00:00:00Z"
valid_until: "2026-10-02T00:00:00Z"
scope:
  allow:
    - hostname: "*.api.example.com"
actions:
  allow: ["tool.http.get"]
sandbox:
  filesystem:
    read: ["/workspace/**"]
    write: ["/workspace/out/**"]
    deny: ["/workspace/secrets/**"]
  syscalls:
    profile: "default"
    deny: ["ptrace", "mount"]
  resources:
    pids_max: 256
    memory_max: "2G"
    cpu_max: "100000 100000"
  credentials:
    max_ttl_seconds: 900
  imds: deny
