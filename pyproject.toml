[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roe-guard"
version = "0.1.0a1"
description = "Rules of Engagement policy-enforcement library — scope, gate, log, clean."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "0rce Labs" },
]
keywords = ["security", "policy", "rules-of-engagement", "scope-control", "audit", "pentest", "red-team"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
roe-guard = "roe_guard.cli:main"

[project.urls]
"Homepage" = "https://github.com/0rce-Labs/roe-guard"
"Repository" = "https://github.com/0rce-Labs/roe-guard"
"Issues" = "https://github.com/0rce-Labs/roe-guard/issues"

[tool.setuptools]
packages = ["roe_guard", "roe_guard.integrations"]

[tool.coverage.run]
source = ["roe_guard"]

[tool.coverage.report]
fail_under = 93
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
